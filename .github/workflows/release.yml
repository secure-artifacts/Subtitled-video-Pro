name: Build and Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*' # 打标签时自动触发
  workflow_dispatch:
    inputs:
      version:
        description: 'v1.0.6'
        required: true
        default: 'v1.0.0'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==================== 工人 1：负责打包 Windows ====================
  build-windows:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine requests playwright

      # 👑 暴力破解：直接关闭云端 Windows 机器的自带杀毒软件！
      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # 打包 1：单文件版 (.exe)
      - name: Package to Standalone EXE
        run: |
          pyinstaller --noconfirm --clean --noconsole --onefile --name "Subtitled-video-Pro-Windows" --icon "assets/icon.ico" --collect-all playwright main.py

      # 打包 2：绿色免安装版 (输出为文件夹，然后打成 .zip 包)
      - name: Package to Green Portable ZIP
        run: |
          pyinstaller --noconfirm --clean --noconsole --onedir --name "Subtitled-video-Pro-Portable" --icon "assets/icon.ico" --collect-all playwright main.py
          # 将文件夹压缩成 ZIP
          Compress-Archive -Path "dist\Subtitled-video-Pro-Portable" -DestinationPath "dist\Subtitled-video-Pro-Windows-Portable.zip"

      # 一次性给 .exe 和 .zip 都生成安全证明
      - name: Attest Windows Assets
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Subtitled-video-Pro-Windows.exe
            dist/Subtitled-video-Pro-Windows-Portable.zip

      - name: Export Provenance File
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "dist/Subtitled-video-Pro-Win-provenance.jsonl"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Assets
          path: |
            dist/Subtitled-video-Pro-Windows.exe
            dist/Subtitled-video-Pro-Windows-Portable.zip
            dist/Subtitled-video-Pro-Win-provenance.jsonl

  # ==================== 工人 2：负责打包 macOS ====================
  build-macos:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine requests playwright

      - name: Package to Mac APP
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "Subtitled-video-Pro" --icon "assets/icon.icns" --collect-all playwright main.py
          
      - name: Create DMG Installer
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Subtitled-video-Pro" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --hide-extension "Subtitled-video-Pro.app" \
            --app-drop-link 425 120 \
            "dist/Subtitled-video-Pro-macOS.dmg" \
            "dist/Subtitled-video-Pro.app"

      - name: Attest macOS DMG
        id: attest_mac
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/Subtitled-video-Pro-macOS.dmg'

      - name: Export macOS Provenance File
        shell: bash
        run: |
          cp "${{ steps.attest_mac.outputs.bundle-path }}" "dist/Subtitled-video-Pro-macOS-provenance.jsonl"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Assets
          path: |
            dist/Subtitled-video-Pro-macOS.dmg
            dist/Subtitled-video-Pro-macOS-provenance.jsonl

  # ==================== 发货中心：统一收集并创建 Release ====================
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          # 👑 终极发货命令：中转站里有啥，全给我发上去！
          files: artifacts/**/*
          generate_release_notes: true
          make_latest: true
