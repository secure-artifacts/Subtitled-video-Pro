name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example V0.1.12"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  APP_NAME: SubtitleComposer
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows x64 release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Resolve release tag
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}".Trim()
          if (-not ($tag -match '^[vV][0-9]+\.[0-9]+\.[0-9]+$')) {
            throw "Release tag must look like v0.1.0 or V0.1.0. Received: $tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate release inputs
        run: |
          $required = @(
            "settings.example.json",
            "font_registry.json",
            "nlp_dictionary.txt",
            "fonts\open\open_fonts_manifest.json",
            "LICENSE",
            "COPYING",
            "LICENSE.LIST",
            "THIRD_PARTY_NOTICES.md",
            "SECURITY.md",
            "RELEASE_NOTES_TEMPLATE.md",
            "docs\DEPENDENCY_LICENSE_AUDIT.md",
            "docs\SECURITY_ATTESTATION.md",
            "docs\RELEASE_PROCESS.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required release input is missing: $path"
            }
          }
          if (Test-Path -LiteralPath "settings.json") {
            throw "settings.json is local-only and must not be included in a public release checkout."
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium

      - name: Download ffmpeg (Windows)
        run: |
          $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zipFile = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipFile -UseBasicParsing
          Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force
          $ffmpegDir = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "vendor\windows\ffmpeg\bin" | Out-Null
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" "vendor\windows\ffmpeg\bin\" -Force
          Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" "vendor\windows\ffmpeg\bin\" -Force
          Copy-Item "$($ffmpegDir.FullName)\bin\ffplay.exe" "vendor\windows\ffmpeg\bin\" -Force
          Copy-Item "$($ffmpegDir.FullName)\LICENSE" "vendor\windows\ffmpeg\" -ErrorAction SilentlyContinue -Force
          Copy-Item "$($ffmpegDir.FullName)\README.txt" "vendor\windows\ffmpeg\" -ErrorAction SilentlyContinue -Force
          Get-ChildItem "vendor\windows\ffmpeg\bin"

      - name: Build Windows app
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          $pyinstallerArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--name", $env:APP_NAME,
            "--icon", "app_logo.ico",
            "--add-data", "app_logo.png;.",
            "--add-data", "app_logo.ico;.",
            "--add-data", "icon.png;.",
            "--add-data", "settings.example.json;.",
            "--add-data", "font_registry.json;.",
            "--add-data", "nlp_dictionary.txt;.",
            "--add-data", "fonts/open;fonts/open",
            "--add-data", "vendor/windows/ffmpeg;vendor/windows/ffmpeg",
            "--collect-all", "PyQt6",
            "--collect-all", "playwright",
            "--hidden-import", "PyQt6.QtWebEngineWidgets",
            "--hidden-import", "PyQt6.QtWebEngineCore",
            "--hidden-import", "PyQt6.QtWebChannel",
            "--hidden-import", "PyQt6.QtMultimedia",
            "--hidden-import", "playwright.sync_api",
            "main.py"
          )
          python -m PyInstaller @pyinstallerArgs

      - name: Package Windows artifact
        run: |
          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null

          $distApp = Join-Path $PWD "dist\$env:APP_NAME"
          if (-not (Test-Path $distApp)) {
            throw "PyInstaller output not found: $distApp"
          }

          $noticeFiles = @(
            "README.md",
            "LICENSE",
            "COPYING",
            "LICENSE.LIST",
            "THIRD_PARTY_NOTICES.md",
            "SECURITY.md",
            "RELEASE_NOTES_TEMPLATE.md",
            "docs\DEPENDENCY_LICENSE_AUDIT.md",
            "docs\SECURITY_ATTESTATION.md",
            "docs\RELEASE_PROCESS.md"
          )
          foreach ($file in $noticeFiles) {
            if (Test-Path $file) {
              $destination = Join-Path $distApp $file
              New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $file -Destination $destination -Force
            }
          }

          $artifactName = "$env:APP_NAME-$env:RELEASE_TAG-windows-x64.zip"
          $artifactPath = Join-Path $releaseDir $artifactName
          Compress-Archive -Path (Join-Path $distApp "*") -DestinationPath $artifactPath -Force

          $hash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $artifactName" | Set-Content -LiteralPath (Join-Path $releaseDir "checksums-windows-x64.sha256") -Encoding ascii

      - name: Attest Windows build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.zip
            release/checksums-windows-x64.sha256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: release/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    defaults:
      run:
        shell: bash

    steps:
      - name: Resolve release tag
        run: |
          tag="$(printf '%s' "${{ github.event.inputs.tag || github.ref_name }}" | xargs)"
          if [[ ! "$tag" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.1.0 or V0.1.0. Received: $tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate release inputs
        run: |
          required=(
            "settings.example.json"
            "font_registry.json"
            "nlp_dictionary.txt"
            "fonts/open/open_fonts_manifest.json"
            "LICENSE"
            "COPYING"
            "LICENSE.LIST"
            "THIRD_PARTY_NOTICES.md"
            "SECURITY.md"
            "RELEASE_NOTES_TEMPLATE.md"
            "docs/DEPENDENCY_LICENSE_AUDIT.md"
            "docs/SECURITY_ATTESTATION.md"
            "docs/RELEASE_PROCESS.md"
          )
          for path in "${required[@]}"; do
            if [ ! -e "$path" ]; then
              echo "Required release input is missing: $path" >&2
              exit 1
            fi
          done
          if [ -e "settings.json" ]; then
            echo "settings.json is local-only and must not be included in a public release checkout." >&2
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          export PLAYWRIGHT_BROWSERS_PATH=0
          python -m playwright install chromium

      - name: Download ffmpeg (macOS)
        run: |
          mkdir -p vendor/darwin/ffmpeg/bin
          brew install ffmpeg
          cp "$(which ffmpeg)" vendor/darwin/ffmpeg/bin/ffmpeg
          cp "$(which ffprobe)" vendor/darwin/ffmpeg/bin/ffprobe
          chmod +x vendor/darwin/ffmpeg/bin/*
          brew info ffmpeg > vendor/darwin/ffmpeg/HOMEBREW-INFO.txt

      - name: Create macOS app icon
        run: |
          mkdir -p build/app.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" app_logo.png --out "build/app.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" app_logo.png --out "build/app.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/app.iconset -o build/app_logo.icns

      - name: Build macOS app
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          set +e
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "$APP_NAME" \
            --icon build/app_logo.icns \
            --add-data "app_logo.png:." \
            --add-data "app_logo.ico:." \
            --add-data "icon.png:." \
            --add-data "settings.example.json:." \
            --add-data "font_registry.json:." \
            --add-data "nlp_dictionary.txt:." \
            --add-data "fonts/open:fonts/open" \
            --add-data "vendor/darwin/ffmpeg:vendor/darwin/ffmpeg" \
            --collect-all PyQt6 \
            --collect-all playwright \
            --hidden-import PyQt6.QtWebEngineWidgets \
            --hidden-import PyQt6.QtWebEngineCore \
            --hidden-import PyQt6.QtWebChannel \
            --hidden-import PyQt6.QtMultimedia \
            --hidden-import playwright.sync_api \
            main.py
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "PyInstaller macOS .app build failed; creating source-runner fallback package."
            fallback_dir="dist/${APP_NAME}-macos-${{ matrix.arch }}-source-runner"
            mkdir -p "$fallback_dir"
            rsync -a \
              --exclude ".git" \
              --exclude "build" \
              --exclude "dist" \
              --exclude "release" \
              --exclude "__pycache__" \
              ./ "$fallback_dir/"
            cat > "$fallback_dir/run.command" <<'EOF'
          #!/bin/bash
          set -e
          cd "$(dirname "$0")"
          if [ ! -d ".venv" ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python main.py
          EOF
            chmod +x "$fallback_dir/run.command"
            cat > "$fallback_dir/MACOS_PACKAGE_NOTE.txt" <<'EOF'
          This is a macOS source-runner fallback package generated by GitHub Actions.
          Open run.command to create a local virtual environment, install Python dependencies, and start Subtitle Composer.
          The standalone PyInstaller .app bundle failed on the GitHub-hosted macOS runner for this release.
          EOF
          fi

      - name: Package macOS artifact
        run: |
          release_dir="$PWD/release"
          mkdir -p "$release_dir"

          dist_app="$PWD/dist/${APP_NAME}.app"
          fallback_dir="$PWD/dist/${APP_NAME}-macos-${{ matrix.arch }}-source-runner"
          artifact_suffix="macos-${{ matrix.arch }}"
          package_target="$dist_app"
          if [ -d "$dist_app" ]; then
            resources="$dist_app/Contents/Resources"
            notice_files=(
              "README.md"
              "LICENSE"
              "COPYING"
              "LICENSE.LIST"
              "THIRD_PARTY_NOTICES.md"
              "SECURITY.md"
              "RELEASE_NOTES_TEMPLATE.md"
              "docs/DEPENDENCY_LICENSE_AUDIT.md"
              "docs/SECURITY_ATTESTATION.md"
              "docs/RELEASE_PROCESS.md"
            )
            for file in "${notice_files[@]}"; do
              if [ -f "$file" ]; then
                mkdir -p "$resources/$(dirname "$file")"
                cp "$file" "$resources/$file"
              fi
            done
            codesign --force --deep --sign - "$dist_app"
          elif [ -d "$fallback_dir" ]; then
            package_target="$fallback_dir"
            artifact_suffix="macos-${{ matrix.arch }}-source-runner"
          else
            echo "No macOS package output found." >&2
            exit 1
          fi

          artifact_name="${APP_NAME}-${RELEASE_TAG}-${artifact_suffix}.zip"
          artifact_path="$release_dir/$artifact_name"
          ditto -c -k --sequesterRsrc --keepParent "$package_target" "$artifact_path"

          hash="$(shasum -a 256 "$artifact_path" | awk '{print $1}')"
          printf "%s  %s\n" "$hash" "$artifact_name" > "$release_dir/checksums-macos-${{ matrix.arch }}.sha256"

      - name: Attest macOS build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.zip
            release/checksums-macos-${{ matrix.arch }}.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create combined checksums
        run: |
          cd release
          sha256sum *.zip > checksums.sha256
          cat checksums.sha256

      - name: Attest release manifest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/checksums.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/**/*
          generate_release_notes: true
