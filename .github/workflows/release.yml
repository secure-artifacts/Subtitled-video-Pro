name: Build and Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*' # 打标签时自动触发
  workflow_dispatch:
    inputs:
      version:
        description: 'v1.0.0'
        required: true
        default: 'v1.0.0'

jobs:
  # ==================== 工人 1：负责打包 Windows (生成 .exe) ====================
  build-windows:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine requests playwright

      - name: Package to EXE
        run: |
          pyinstaller --noconfirm --clean --noconsole --onefile --name "SubtitleVideoPro-Windows" --icon "assets/icon.ico" --collect-all playwright main.py
          
      # 1. 生成安全证明，并给这一步加上 id: attest 方便后续调用
      - name: Attest EXE (生成安全证明)
        id: attest  # 👑 关键：加一个 ID
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/SubtitleVideoPro-Windows.exe'  # 👉 修改点：加了 -Windows

      # 2. 👑 核心破解步：把隐藏的证明文件拷出来，变成肉眼可见的 .jsonl 文件
      - name: Export Provenance File (导出实体证明文件)
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "dist/SubtitleVideoPro-provenance.jsonl"

      # 3. 把 exe 和 证明文件 一起打包存入中转站
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: |
            dist/SubtitleVideoPro-Windows.exe  # 👉 修改点：加了 -Windows
            dist/SubtitleVideoPro-provenance.jsonl

  # ==================== 工人 2：负责打包 macOS (生成 .dmg) ====================
  build-macos:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 PyQt6-WebEngine requests playwright

      - name: Package to Mac APP
        # Mac 必须要加 --windowed 参数，这样才会生成漂亮的 .app 图形应用文件夹
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "SubtitleVideoPro" --icon "assets/icon.icns" --collect-all playwright main.py
          
      - name: Create DMG Installer
        # 使用 create-dmg 工具，把 .app 封装成苹果用户最熟悉的 .dmg 安装包
        run: |
          brew install create-dmg
          create-dmg \
            --volname "SubtitleVideoPro" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --hide-extension "SubtitleVideoPro.app" \
            --app-drop-link 425 120 \
            "dist/SubtitleVideoPro-macOS.dmg" \
            "dist/SubtitleVideoPro.app"

      - name: Attest macOS DMG (生成安全证明)
        id: attest_mac  # 加个 ID
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/SubtitleVideoPro-macOS.dmg'

      # 增加这一步把 Mac 的证明也导出来
      - name: Export macOS Provenance File
        shell: bash
        run: |
          cp "${{ steps.attest_mac.outputs.bundle-path }}" "dist/SubtitleVideoPro-macOS-provenance.jsonl"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: |
            dist/SubtitleVideoPro-macOS.dmg
            dist/SubtitleVideoPro-macOS-provenance.jsonl # 一起传上去

  # ==================== 发货中心：统一收集并创建 Release ====================
  release:
    needs: [build-windows, build-macos] # 👑 关键：告诉发货中心，必须等这两个工人都干完活！
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # 👑 把 Windows 和 Mac 的产物合并到同一个文件夹里

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          files: |
            artifacts/SubtitleVideoPro-Windows.exe  # 👉 修改点：加了 -Windows
            artifacts/SubtitleVideoPro-macOS.dmg    # 👉 修复点：顺便把 Mac 的安装包也加进发版列表
            artifacts/SubtitleVideoPro-provenance.jsonl  # 👑 把证明文件也发到 Release 页面
          generate_release_notes: true
          make_latest: true
